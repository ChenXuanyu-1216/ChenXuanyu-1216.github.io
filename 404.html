<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · LA</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07070B">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'1'%20x2%3D'1'%20y2%3D'0'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%23F2B632'%2F%3E%3Cstop%20offset%3D'.55'%20stop-color%3D'%23F0566A'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%238B5CF6'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D'32'%20cy%3D'32'%20r%3D'31'%20fill%3D'url(%23g)'%2F%3E%3Ccircle%20cx%3D'32'%20cy%3D'32'%20r%3D'26'%20fill%3D'%23fff'%2F%3E%3Ctext%20x%3D'32'%20y%3D'41'%20font-family%3D'Arial%2CHelvetica%2Csans-serif'%20font-weight%3D'800'%20font-size%3D'22'%20text-anchor%3D'middle'%20fill%3D'%23262626'%3ELA%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..600&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--night:#07070B;--line:rgba(236,236,242,.10);--text:#ECECF2;--mute:#8D8E9C;--link:#CBB9FF;
--display:"Archivo","Geist","Noto Sans SC",system-ui,sans-serif;--sans:"Geist","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;color:var(--text);font:400 1rem/1.7 var(--sans);
background:radial-gradient(ellipse 70% 55% at 50% 115%,rgba(139,92,246,.30),transparent 70%),radial-gradient(ellipse 50% 40% at 15% 0%,rgba(240,86,106,.14),transparent 70%),radial-gradient(ellipse 40% 35% at 90% 5%,rgba(242,182,50,.08),transparent 70%),var(--night)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 64px}
.code{margin:0;font:500 clamp(96px,22vw,220px)/.85 var(--display);font-stretch:118%;letter-spacing:-.06em;
background:linear-gradient(100deg,#F2B632,#F0566A 50%,#8B5CF6);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9}
.lane{position:relative;width:min(320px,100%);height:56px;margin:18px 0 30px;border-bottom:1px solid var(--line);overflow:hidden}
.walker{position:absolute;left:50%;bottom:0;width:27px;height:56px;margin-left:-14px;background:url("/assets/la-walk-v1.png") 0 0/405px 56px no-repeat;image-rendering:pixelated;
filter:drop-shadow(0 0 1px rgba(236,236,242,.9)) drop-shadow(0 0 10px rgba(240,86,106,.55));animation:steps-walk .95s steps(15) infinite,pace 9s ease-in-out infinite}
.walker::after{content:"?";position:absolute;top:-4px;right:-14px;font:600 1.1rem/1 var(--sans);color:#F0566A;animation:huh 9s ease-in-out infinite}
@keyframes steps-walk{to{background-position:-405px 0}}
@keyframes pace{0%,100%{transform:translateX(-110px) scaleX(1)}45%{transform:translateX(110px) scaleX(1)}50%{transform:translateX(110px) scaleX(-1)}95%{transform:translateX(-110px) scaleX(-1)}}
@keyframes huh{0%,40%,55%,100%{opacity:0}45%,50%{opacity:1}}
h1{margin:0;font:500 clamp(1.75rem,5vw,2.75rem)/1.15 var(--display);font-stretch:110%;letter-spacing:-.03em;word-break:keep-all;overflow-wrap:anywhere}
p.lead{margin:14px 0 34px;max-width:28em;color:var(--mute)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:22px;font-weight:500}
.btn{display:inline-flex;align-items:center;min-height:50px;padding:0 26px;border-radius:999px;background:var(--text);color:var(--night);text-decoration:none;transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 40px -8px rgba(240,86,106,.55),0 8px 60px -10px rgba(139,92,246,.6)}
.link{color:var(--link);text-decoration:none;border-bottom:1px solid rgba(203,185,255,.35);padding-bottom:2px}
.link:hover{border-color:var(--link)}
:focus-visible{outline:2px solid var(--link);outline-offset:4px}
@media (prefers-reduced-motion:reduce){.walker{animation:none}.walker::after{animation:none;opacity:1}.btn{transition:none}}
</style>
</head>
<body>
<main>
<p class="code" aria-label="404">404</p>
<div class="lane" aria-hidden="true"><span class="walker"></span></div>
<h1 id="t">这个页面走丢了。</h1>
<p class="lead" id="d">像素 LA 找了一圈，也没找到你要的页面。可能是链接写错了，或者页面已经搬走了。</p>
<div class="btns"><a class="btn" id="home" href="/">回到首页</a><a class="link" id="pixel" href="/digital-me/index.html">去像素日常看看</a></div>
</main>
<script>
// English for anything under /en/ (or an English-language browser on other paths).
(function(){
var en=/^\/(digital-me\/)?en(\/|$)/.test(location.pathname)||/^en\b/i.test(navigator.language||'');
if(!en)return;
document.documentElement.lang='en';document.title='Page not found · LA';
document.getElementById('t').textContent='This page wandered off.';
document.getElementById('d').textContent='Pixel LA looked everywhere but could not find it. The link may be mistyped, or the page has moved.';
var h=document.getElementById('home');h.textContent='Back to home';h.href='/en/';
var p=document.getElementById('pixel');p.textContent='Visit my pixel life';p.href='/digital-me/en/index.html';
})();
</script>
</body>
</html>
