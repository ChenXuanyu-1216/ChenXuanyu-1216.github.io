<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>页面走丢了 · LA</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id%3D'g'%20x1%3D'0'%20y1%3D'1'%20x2%3D'1'%20y2%3D'0'%3E%3Cstop%20offset%3D'0'%20stop-color%3D'%23F2B632'%2F%3E%3Cstop%20offset%3D'.55'%20stop-color%3D'%23F0566A'%2F%3E%3Cstop%20offset%3D'1'%20stop-color%3D'%238B5CF6'%2F%3E%3C%2FlinearGradient%3E%3C%2Fdefs%3E%3Ccircle%20cx%3D'32'%20cy%3D'32'%20r%3D'31'%20fill%3D'url(%23g)'%2F%3E%3Ccircle%20cx%3D'32'%20cy%3D'32'%20r%3D'26'%20fill%3D'%23fff'%2F%3E%3Ctext%20x%3D'32'%20y%3D'41'%20font-family%3D'Arial%2CHelvetica%2Csans-serif'%20font-weight%3D'800'%20font-size%3D'22'%20text-anchor%3D'middle'%20fill%3D'%23262626'%3ELA%3C%2Ftext%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--ink:#262626;--muted:#737373;--line:#DBDBDB;--ring:linear-gradient(45deg,#F2B632,#F0566A 55%,#8B5CF6);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{min-height:100vh;display:flex;flex-direction:column;font:400 1rem/1.7 Inter,"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:"";height:3px;background:linear-gradient(90deg,#F2B632,#F0566A 55%,#8B5CF6)}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 16px 64px}
.code{margin:0 0 8px;font:600 .8125rem/1 Inter,sans-serif;letter-spacing:.12em;color:var(--muted)}
.lane{position:relative;width:min(320px,100%);height:112px;margin:8px 0 28px;border-bottom:1px solid var(--line);overflow:hidden}
.walker{position:absolute;left:50%;bottom:0;width:54px;height:112px;margin-left:-27px;background:url("/assets/la-walk-v1.png") 0 0/810px 112px no-repeat;animation:steps-walk .95s steps(15) infinite,pace 9s ease-in-out infinite}
.walker::after{content:"?";position:absolute;top:-2px;right:-14px;font:700 1.25rem/1 Inter,sans-serif;color:#F0566A;animation:huh 9s ease-in-out infinite}
@keyframes steps-walk{to{background-position:-810px 0}}
@keyframes pace{0%,100%{transform:translateX(-90px) scaleX(1)}45%{transform:translateX(90px) scaleX(1)}50%{transform:translateX(90px) scaleX(-1)}95%{transform:translateX(-90px) scaleX(-1)}}
@keyframes huh{0%,40%,55%,100%{opacity:0}45%,50%{opacity:1}}
h1{margin:0;font-size:clamp(1.75rem,5vw,2.5rem);font-weight:700;line-height:1.25;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
p.lead{margin:14px 0 30px;max-width:26em;color:var(--muted)}
.btns{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;font:600 .9375rem Inter,"Noto Sans SC",sans-serif}
.btn{display:inline-block;padding:13px 22px;border-radius:10px;text-decoration:none;color:var(--ink);border:1px solid var(--line)}
.btn.fill{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:hover{border-color:var(--ink)}.btn.fill:hover{opacity:.86}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.walker{animation:none}.walker::after{animation:none;opacity:1}}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<div class="lane" aria-hidden="true"><span class="walker"></span></div>
<h1 id="t">这个页面走丢了。</h1>
<p class="lead" id="d">像素 LA 找了一圈，也没找到你要的页面。可能是链接写错了，或者页面已经搬走了。</p>
<div class="btns"><a class="btn fill" id="home" href="/">回到首页</a><a class="btn" id="pixel" href="/digital-me/index.html">去像素日常看看</a></div>
</main>
<script>
// English for anything under /en/ (or an English-language browser on other paths).
(function(){
var en=/^\/(digital-me\/)?en(\/|$)/.test(location.pathname)||/^en\b/i.test(navigator.language||'');
if(!en)return;
document.documentElement.lang='en';document.title='Page not found · LA';
document.getElementById('t').textContent='This page wandered off.';
document.getElementById('d').textContent='Pixel LA looked everywhere but could not find it. The link may be mistyped, or the page has moved.';
var h=document.getElementById('home');h.textContent='Back to home';h.href='/en/';
var p=document.getElementById('pixel');p.textContent='Visit my pixel life';p.href='/digital-me/en/index.html';
})();
</script>
</body>
</html>
